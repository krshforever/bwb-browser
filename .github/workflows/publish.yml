# Publish to npm on a tag, with no stored secret.
#
# The registry's own rule is the reason this exists: a token that can publish
# directly either needs an OTP at the moment of publishing or has to carry a
# 2FA bypass — and bypass tokens stop being able to publish in January 2027.
# Trusted publishing removes the token entirely: GitHub mints a short-lived
# OIDC identity, npm checks that it was the workflow we registered, and the
# tarball gets a provenance attestation as a side effect.
#
# One-time setup on npmjs.com → bwb-browser → Settings → Trusted Publisher:
#   Publisher: GitHub Actions
#   Organization or user: krshforever
#   Repository: bwb-browser
#   Workflow filename: publish.yml
#   Environment: (leave empty)
#
# Until that is registered, this workflow fails at the publish step with
# "not authorized" and nothing is published — it cannot publish to the wrong
# place, which is the failure mode worth designing for.

name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # the OIDC identity npm verifies

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1, and npm 12
      # itself needs Node ^22.22.2 || ^24.15.0 || >=26 — so the floor is the
      # more demanding of the two. 24.15.0 satisfies both. Bounded to npm 12,
      # not `@latest`: a future npm major with a newer engine would fail here
      # for a reason that has nothing to do with this package.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      - name: npm version
        run: npm install -g 'npm@^12' && node --version && npm --version

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # The same gate the release was reviewed under. A tag that does not pass
      # this must not reach the registry.
      - name: Verify
        run: npm run lint && npm test && npm run verify:docs && npm run smoke

      # A tag that disagrees with package.json must never reach the registry.
      # A manual dispatch has no tag (GITHUB_REF_NAME is the branch), so there we
      # read the version from package.json and print exactly what will be
      # published — the guard is "these two agree", not "a tag exists".
      - name: Resolve the version being published
        id: v
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$PKG" != "$TAG" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json $PKG"
              exit 1
            fi
            echo "Publishing $PKG from tag $GITHUB_REF_NAME"
          else
            echo "Publishing $PKG from a manual dispatch on $GITHUB_REF_NAME (no tag to check)"
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run

      - name: Publish
        if: github.event_name == 'push' || !inputs.dry_run
        run: npm publish --provenance --access public
