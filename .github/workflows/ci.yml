name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run verify:docs
      - run: npm run smoke

  # The findings a code review could not settle: the static→browser handoff, the
  # sandbox, click accuracy, watch cleanup, tab lifecycle. Skips itself when no
  # Chrome/Chromium is present.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y chromium-browser
      - run: npm run test:browser

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm pack --dry-run
      # The release gate: tool count must not creep. 41 tools = 40 `browser_*`
      # keys plus `needs_human`. This step said "26" for four releases after the
      # 4.0 era ended, so the gate had been red — or rather, it had been failing
      # loudly and being ignored, which is worse than absent.
      - name: tool count is still 41
        run: |
          COUNT=$(grep -cE '^  (browser_[A-Za-z0-9_]*|needs_human):' server.mjs || true)
          echo "tool keys in server.mjs: $COUNT"
          test "$COUNT" -eq 41