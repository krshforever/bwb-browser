name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm pack --dry-run
      # The release gate: tool count must not creep.
      - name: tool count is still 26
        run: |
          COUNT=$(grep -c '^  browser_' server.mjs || true)
          echo "browser_* tool keys in server.mjs: $COUNT"
          test "$COUNT" -eq 26